---
- name: Verify prerequisites for K8s VM deployment
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - root_password.yml

  tasks:
    - name: Ensure packages are present on control system
      ansible.builtin.dnf:
        name:
          - libvirt
          - qemu-kvm
          - virt-manager
          - ansible
          - genisoimage
        state: latest

    - name: Ensure libvirtd service is running
      ansible.builtin.service:
        name: libvirtd
        state: started
        enabled: true

    - name: Check if virt-install is installed
      ansible.builtin.command: which virt-install
      register: virt_install_check
      failed_when: virt_install_check.rc != 0
      changed_when: false

    - name: Ensure community.libvirt collection is installed
      community.general.ansible_galaxy_install:
        type: collection
        name: community.libvirt
        state: present

- name: Deploy K8s VMs
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars_files:
    - root_password.yml

  vars:
    vms:
      - name: kcontrol
        memory: 2048
        vcpus: 2
        ip: 192.168.122.30
      - name: kworker1
        memory: 2048
        vcpus: 2
        ip: 192.168.122.31
      - name: kworker2
        memory: 2048
        vcpus: 2
        ip: 192.168.122.32
    gateway_ip: 192.168.122.1
    system_img_dir: /var/lib/libvirt/images/
    ssh_public_key: |
      "ssh-rsa 
      sdiament@samworklaptop2"
    base_image: ubuntu-noble.qcow2
    libvirt_uri: qemu:///system

  tasks:
    - name: Provisions all VMS in the cluster
      loop: "{{ vms }}"
      loop_control:
        loop_var: item
      ansible.builtin.include_tasks: tasks/provision_vm.yml
