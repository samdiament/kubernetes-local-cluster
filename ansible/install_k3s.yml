---
- name: Install K3s
  hosts: control_plane
  become: true

  tasks:
    - name: Download and install K3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s token to be generated
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
      register: token_wait
      retries: 10
      delay: 5

    - name: Read K3s node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_slurp

    - name: Set token fact for worker nodes
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_token_slurp.content | b64decode | trim }}"
      delegate_to: localhost
      delegate_facts: true

- name: Install K3 workers and join cluster
  hosts: workers
  become: true

  tasks:
    - name: Download and install K3s agent
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}:6443 K3S_TOKEN={{ hostvars['localhost']['k3s_token'] }} sh -
      args:
        creates: /usr/local/bin/k3s
